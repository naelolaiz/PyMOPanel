[project]
name = "pymopanel"
version = "0.1.0"
description = "Python module to control Matrix Orbital GLK19264-7T-1U LCD+keyboard USB panels"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "pyusb>=1.3.1",
]

[project.optional-dependencies]
# Required only for bitmap/GIF upload (graphics.uploadAndShowBitmap)
bitmap = ["Pillow>=10.0"]
# Required only for font editing (font.py, filesystem upload/download)
fonts = ["numpy>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["PyMOPanel"]

[dependency-groups]
dev = []
